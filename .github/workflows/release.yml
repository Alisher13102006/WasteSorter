# ЛР8 задания 11–12: CD. Тег v* -> подписанный AAB -> трек internal -> (ручное подтверждение) -> production.
#
# CI Secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64   base64 от upload-keystore (.jks):  base64 -i wastesorter-upload.jks | pbcopy
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON JSON сервис-аккаунта Google Cloud с доступом к Play Console (роль Release manager)
#   GOOGLE_SERVICES_JSON      (необязательно) содержимое app/google-services.json для Crashlytics
# Environment "production" (Settings -> Environments) с Required reviewers = ручное подтверждение.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rollout:
        description: "Доля пользователей для production (0.01, 0.1, 0.5, 1.0)"
        default: "0.01"

env:
  PACKAGE: kz.wastesorter.app

jobs:
  build:
    name: Сборка подписанного AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Проверить, что тег совпадает с versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -E '^val version(Major|Minor|Patch)' app/build.gradle.kts | awk '{print $4}' | paste -sd. -)
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Тег ${GITHUB_REF_NAME} != версия v$V"; exit 1; }

      - name: Восстановить keystore и google-services.json из Secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES" ]; then echo "$GOOGLE_SERVICES" > app/google-services.json; fi

      - name: Unit-тесты + bundleRelease + assembleRelease
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt

      # APK для прямой установки / RuStore — прикрепляется к GitHub Release
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          body_path: fastlane/metadata/android/ru-RU/changelogs/latest.txt

  internal:
    name: Загрузка в трек internal
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release, path: out }
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: out/bundle/release/app-release.aab
          mappingFile: out/mapping/release/mapping.txt
          track: internal
          status: completed
          whatsNewDirectory: fastlane/metadata/android/whatsnew

  production:
    name: Production (поэтапно, после ручного подтверждения)
    needs: internal
    runs-on: ubuntu-latest
    environment: production        # Required reviewers -> job ждёт нажатия "Approve"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release, path: out }
      # Задание 12: staged rollout. Стартуем с 1%, дальше 10% -> 50% -> 100%
      # повторным запуском workflow_dispatch с нужным rollout или в Play Console.
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: out/bundle/release/app-release.aab
          mappingFile: out/mapping/release/mapping.txt
          track: production
          status: inProgress
          userFraction: ${{ github.event.inputs.rollout || '0.01' }}
          whatsNewDirectory: fastlane/metadata/android/whatsnew
