# ЛР8 задание 10: CI на каждый коммит (любая ветка) и pull request.
# Сборка + ktlint + Android Lint + unit-тесты; debug-APK сохраняется как артефакт.
name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]   # теги собирает release.yml

jobs:
  build:
    name: Сборка, линтеры, unit-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint "app/src/**/*.kt" --reporter=plain --reporter=html,output=ktlint-report.html || true

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Unit-тесты
        run: ./gradlew :app:testDebugUnitTest

      - name: Сборка debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            ktlint-report.html
            app/build/reports/**
            app/build/test-results/**
